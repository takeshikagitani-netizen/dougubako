<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登録が完了しました｜社長の道具箱・仕事の道具箱</title>
<meta name="robots" content="noindex">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-7MNCBVRLHG"></script>
<script>
window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}
gtag('js',new Date());gtag('config','G-7MNCBVRLHG');
</script>
<style>
/* エキスパのフォーム送信後の移り先。ブラウザに「登録済み」を記録し、来た道具へ戻す */
:root{color-scheme:light;--bg:#f6f7f9;--surface:#fff;--ink:#152033;--muted:#5d6878;--line:#dde2ea;--navy:#1d3557;--ok:#1f7a4d;--ok-bg:#e3f4ea}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f141c;--surface:#171e29;--ink:#e6ebf2;--muted:#9aa5b5;--line:#2a3443;--navy:#9cbbe6;--ok:#74d3a2;--ok-bg:#163327}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;font-size:15px;line-height:1.8;padding:48px 16px}
.card{max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px 24px;display:grid;gap:14px}
h1{margin:0;font-size:22px;color:var(--ok)}
p{margin:0}
.muted{color:var(--muted);font-size:13px}
a.btn{display:inline-block;background:var(--navy);color:var(--surface);text-decoration:none;font-weight:700;border-radius:6px;padding:10px 18px}
</style>
</head>
<body>
<div class="card">
  <h1>登録が完了しました</h1>
  <p id="msg">確認のメールをお送りしました。数分たっても届かないときは、迷惑メールのフォルダを確かめてください。</p>
  <p>迷惑メールのフォルダに入っていることがあります。見つけたら「迷惑メールではない」にしていただくと、次からのお知らせが届きます。</p>
  <p id="back" hidden><a class="btn" id="backLink" href="./">道具に戻って使う</a></p>
  <p class="muted">このブラウザでは、次から登録画面が出ずに道具を使えます。別のパソコンや別のブラウザで開いたときは、同じメールアドレスでもう一度登録してください。</p>
</div>
<script>
(function(){
  function store(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)return localStorage.removeItem(k);localStorage.setItem(k,v)}catch(e){return null}}
  store('dougubako_registered','1');
  try{gtag('event','tool_register',{source:'expa'})}catch(e){}
  // 道具が登録画面を開く前に、戻り先（同じサイト内のパス）を記録しておく
  var ret=store('dougubako_return');
  var start=new Date('2026-11-01T00:00:00+09:00');
  if(ret && /^\/[\w\-\/\.]*$/.test(ret)){
    store('dougubako_return',null);
    document.getElementById('backLink').href=ret;
    document.getElementById('back').hidden=false;
  }else if(new Date()<start){
    document.getElementById('msg').textContent='11月1日から100日間、毎日お昼12時に、noteで道具を1本ずつ公開します。確認のメールもお送りしました。数分たっても届かないときは、迷惑メールのフォルダを確かめてください。';
  }
})();
</script>
</body>
</html>
